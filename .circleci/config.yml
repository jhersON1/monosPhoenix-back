# Configuración de CircleCI para Backend
# Stack: Node.js + NestJS + TypeORM + pnpm
version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@4.1

jobs:
  test:
    executor: node/default
    environment:
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Run tests
          command: pnpm exec jest --ci --runInBand --reporters=default --reporters=jest-junit
      - store_test_results:
          path: ./test-results/

  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Build project
          command: pnpm build
      # Guardamos el bundle para el job de deploy
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deploy:
    executor: node/default
    steps:
      # Descargamos los archivos que el job 'build' generó
      - attach_workspace:
          at: .
      # Configuramos credenciales de AWS (requiere variables de entorno en CircleCI)
      - aws-cli/setup
      # Empaquetamos lambda.js (webpack ya bundleó todo, incluido pg y typeorm)
      - run:
          name: Crear paquete ZIP
          command: zip -j lambda-payload.zip dist/lambda.js
      # Enviamos el ZIP a AWS Lambda
      - run:
          name: Desplegar código a AWS Lambda
          command: |
            aws lambda update-function-code \
              --function-name $LAMBDA_NAME \
              --zip-file fileb://lambda-payload.zip

workflows:
  build-and-test:
    jobs:
      - test
      - build:
          requires:
            - test
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - develop
