# Configuración de CircleCI para Backend
# Stack: Node.js + NestJS + TypeORM + pnpm
version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@4.1

jobs:
  test:
    executor: node/default
    environment:
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Run tests
          command: pnpm exec jest --ci --runInBand --reporters=default --reporters=jest-junit
      - store_test_results:
          path: ./test-results/

  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Build project
          command: pnpm build
      # Guardamos el bundle generado en el workspace para pasarlo al siguiente job
      - persist_to_workspace:
          root: .
          paths:
            - dist

# 1. Instalamos TODAS las dependencias de producción de forma plana
      - run:
          name: Instalar dependencias de producción (npm plano)
          command: |
            rm -rf node_modules
            # Esto instala Nest, TypeORM, pg, etc., ignorando lo de desarrollo (devDependencies)
            npm install --omit=dev
            
            # Limpieza de archivos basura para garantizar que el ZIP pese poco
            find node_modules -type f -name "*.md" -delete
            find node_modules -type f -name "*.map" -delete
            find node_modules -type f -name "*.ts" -delete
            
      # 2. Comprimimos lambda.js Y la carpeta node_modules completa
      - run:
          name: Crear paquete ZIP
          command: zip -r lambda-payload.zip dist/lambda.js node_modules
          
      # 3. Enviamos a AWS (los siguientes comandos quedan igual)
      - run:
          name: Desplegar código a AWS Lambda
          command: |
            aws lambda update-function-code \
              --function-name $LAMBDA_NAME \
              --zip-file fileb://lambda-payload.zip

workflows:
  build-and-test:
    jobs:
      - test
      - build:
          requires:
            - test
      - deploy:
          requires:
            - build
          filters:
            branches:
              # El despliegue automático se activará únicamente al hacer cambios en 'develop'
              only:
                - develop