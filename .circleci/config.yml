# Configuración CI/CD para el backend NestJS desplegado como imagen de AWS Lambda
version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@5.1.2

jobs:
  test:
    executor: node/default
    environment:
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Check code quality
          command: pnpm lint
      - run:
          name: Run unit tests
          command: pnpm exec jest --ci --runInBand --reporters=default --reporters=jest-junit
      - store_test_results:
          path: ./test-results/

  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Build Lambda application
          command: pnpm run build:lambda

  deploy:
    executor: node/default
    environment:
      AWS_DEFAULT_REGION: us-east-1
      ECR_REPOSITORY: monos-phoenix-back
      LAMBDA_FUNCTION_NAME: monos-phoenix-back-container-dev
    steps:
      - checkout
      - setup_remote_docker
      - aws-cli/setup

      - run:
          name: Resolve immutable image reference
          command: |
            AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            IMAGE_TAG="${CIRCLE_SHA1}"
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            {
              echo "export ECR_REGISTRY=${ECR_REGISTRY}"
              echo "export IMAGE_TAG=${IMAGE_TAG}"
              echo "export IMAGE_URI=${IMAGE_URI}"
            } >> "${BASH_ENV}"

      - run:
          name: Authenticate Docker to Amazon ECR
          command: |
            aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" |
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - run:
          name: Build and push immutable Lambda image
          command: |
            if ECR_IMAGE_RESULT="$(aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1)"; then
              echo "Image ${IMAGE_URI} already exists; reusing the immutable artifact."
            elif [[ "${ECR_IMAGE_RESULT}" == *"ImageNotFoundException"* ]]; then
              docker build \
                --platform linux/amd64 \
                --provenance=false \
                --tag "${IMAGE_URI}" \
                .
              docker push "${IMAGE_URI}"
            else
              echo "${ECR_IMAGE_RESULT}"
              exit 1
            fi

      - run:
          name: Resolve image digest
          command: |
            IMAGE_DIGEST="$(aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"

            if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "None" ]; then
              echo "The pushed image digest could not be resolved."
              exit 1
            fi

            {
              echo "export IMAGE_DIGEST=${IMAGE_DIGEST}"
              echo "export DEPLOY_IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
            } >> "${BASH_ENV}"

      - run:
          name: Enforce ECR vulnerability gate
          command: |
            aws ecr wait image-scan-complete \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageDigest=${IMAGE_DIGEST}"

            read -r CRITICAL HIGH MEDIUM LOW INFORMATIONAL UNDEFINED <<< "$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageDigest=${IMAGE_DIGEST}" \
              --query '[imageScanFindings.findingSeverityCounts.CRITICAL, imageScanFindings.findingSeverityCounts.HIGH, imageScanFindings.findingSeverityCounts.MEDIUM, imageScanFindings.findingSeverityCounts.LOW, imageScanFindings.findingSeverityCounts.INFORMATIONAL, imageScanFindings.findingSeverityCounts.UNDEFINED]' \
              --output text)"

            CRITICAL="${CRITICAL/None/0}"
            HIGH="${HIGH/None/0}"
            MEDIUM="${MEDIUM/None/0}"
            LOW="${LOW/None/0}"
            INFORMATIONAL="${INFORMATIONAL/None/0}"
            UNDEFINED="${UNDEFINED/None/0}"

            echo "ECR scan findings: CRITICAL=${CRITICAL}, HIGH=${HIGH}, MEDIUM=${MEDIUM}, LOW=${LOW}, INFORMATIONAL=${INFORMATIONAL}, UNDEFINED=${UNDEFINED}"

            if [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ]; then
              echo "Deployment blocked: the image contains HIGH or CRITICAL vulnerabilities."
              exit 1
            fi

      - run:
          name: Deploy image to AWS Lambda
          command: |
            aws lambda update-function-code \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --image-uri "${DEPLOY_IMAGE_URI}" \
              >/dev/null

            aws lambda wait function-updated \
              --function-name "${LAMBDA_FUNCTION_NAME}"

      - run:
          name: Verify Lambda deployment
          command: |
            LAST_UPDATE_STATUS="$(aws lambda get-function-configuration \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --query 'LastUpdateStatus' \
              --output text)"

            if [ "${LAST_UPDATE_STATUS}" != "Successful" ]; then
              echo "Lambda deployment finished with status: ${LAST_UPDATE_STATUS}"
              exit 1
            fi

            echo "Lambda ${LAMBDA_FUNCTION_NAME} deployed successfully from ${DEPLOY_IMAGE_URI}."

workflows:
  ci-cd-container:
    jobs:
      - test
      - build:
          requires:
            - test
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - develop
