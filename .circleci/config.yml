version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@5.1.2

jobs:
  # CI: calidad, pruebas, auditoría de dependencias y compilación.
  validate:
    executor: node/default
    environment:
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Check code quality
          command: pnpm lint
      - run:
          name: Run unit tests
          command: pnpm exec jest --ci --runInBand --reporters=default --reporters=jest-junit
      - run:
          name: Audit production dependencies
          command: pnpm audit --prod --audit-level high || true
      - run:
          name: Build HTTP application
          command: pnpm run build:http
      - store_test_results:
          path: ./test-results/

  # CI: construye la imagen Docker HTTP una sola vez para que CD no compile
  # un artefacto diferente al que fue validado.
  build-image:
    executor: node/default
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build production HTTP image
          command: |
            set -euo pipefail

            IMAGE_NAME="monos-phoenix-back"
            IMAGE_TAG="${CIRCLE_SHA1}"
            LOCAL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

            docker build \
              --pull \
              --platform linux/amd64 \
              --provenance=false \
              --tag "${LOCAL_IMAGE}" \
              .

            docker save "${LOCAL_IMAGE}" |
              gzip > /tmp/monos-phoenix-back-image.tar.gz
      - persist_to_workspace:
          root: /tmp
          paths:
            - monos-phoenix-back-image.tar.gz

  # CD: publica en ECR solamente desde develop y espera el escaneo de la
  # imagen antes de permitir el despliegue.
  publish-image:
    executor: node/default
    environment:
      AWS_DEFAULT_REGION: us-east-1
      ECR_REPOSITORY: monos-phoenix-back
    steps:
      - attach_workspace:
          at: /tmp
      - setup_remote_docker
      - aws-cli/setup
      - run:
          name: Load image built by CI
          command: |
            set -euo pipefail

            test -s /tmp/monos-phoenix-back-image.tar.gz
            docker load --input /tmp/monos-phoenix-back-image.tar.gz
      - run:
          name: Resolve immutable image reference
          command: |
            set -euo pipefail

            AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            IMAGE_TAG="${CIRCLE_SHA1}"
            LOCAL_IMAGE="monos-phoenix-back:${IMAGE_TAG}"
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            {
              echo "export ECR_REGISTRY=${ECR_REGISTRY}"
              echo "export IMAGE_TAG=${IMAGE_TAG}"
              echo "export LOCAL_IMAGE=${LOCAL_IMAGE}"
              echo "export IMAGE_URI=${IMAGE_URI}"
            } >> "${BASH_ENV}"
      - run:
          name: Authenticate Docker to Amazon ECR
          command: |
            set -euo pipefail

            aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" |
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"
      - run:
          name: Push immutable image
          command: |
            set -euo pipefail

            if ECR_IMAGE_RESULT="$(aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1)"; then
              echo "Image ${IMAGE_URI} already exists; reusing the immutable artifact."
            elif [[ "${ECR_IMAGE_RESULT}" == *"ImageNotFoundException"* ]]; then
              docker tag "${LOCAL_IMAGE}" "${IMAGE_URI}"
              docker push "${IMAGE_URI}"
            else
              echo "${ECR_IMAGE_RESULT}"
              exit 1
            fi
      - run:
          name: Wait for ECR vulnerability scan
          command: |
            set -euo pipefail

            scan_status=""
            for attempt in $(seq 1 30); do
              scan_status="$(aws ecr describe-image-scan-findings \
                --repository-name "${ECR_REPOSITORY}" \
                --image-id "imageTag=${IMAGE_TAG}" \
                --query 'imageScanStatus.status' \
                --output text 2>/dev/null || true)"

              case "${scan_status}" in
                COMPLETE)
                  break
                  ;;
                FAILED|UNSUPPORTED_IMAGE)
                  echo "ECR image scan finished with status: ${scan_status}"
                  exit 1
                  ;;
                *)
                  echo "ECR image scan status: ${scan_status:-UNKNOWN}; waiting..."
                  sleep 10
                  ;;
              esac
            done

            if [[ "${scan_status}" != "COMPLETE" ]]; then
              echo "ECR image scan did not complete within the expected time."
              echo "Enable scan-on-push for the ECR repository."
              exit 1
            fi

            echo "ECR HIGH/CRITICAL finding details:"
            aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findings[?severity==`HIGH` || severity==`CRITICAL`].{severity:severity,cve:name,attributes:attributes,uri:uri}' \
              --output json

            findings="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findings[?severity==`HIGH` || severity==`CRITICAL`].[severity,name,uri]' \
              --output text)"

            # Temporary, explicit risk acceptance for vulnerabilities inherited
            # from the Node.js 24 base image.
            RISK_ACCEPTANCE_EXPIRES_ON="2026-08-31"
            risk_acceptance_active=true

            if [[ "$(date -u +%Y-%m-%d)" > "${RISK_ACCEPTANCE_EXPIRES_ON}" ]]; then
              risk_acceptance_active=false
            fi

            critical="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
              --output text)"
            high="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findingSeverityCounts.HIGH' \
              --output text)"

            [[ -z "${critical}" || "${critical}" == "None" ]] && critical=0
            [[ -z "${high}" || "${high}" == "None" ]] && high=0

            accepted_findings=0
            blocking_findings=0

            if [[ -n "${findings}" && "${findings}" != "None" ]]; then
              while IFS=$'\t' read -r severity cve uri; do
                if [[ -z "${cve}" || "${cve}" == "None" ]]; then
                  echo "BLOCKING: ECR returned a HIGH/CRITICAL finding without a CVE identifier."
                  blocking_findings=$((blocking_findings + 1))
                  continue
                fi

                case "${cve}" in
                  CVE-2026-58016|CVE-2026-54369)
                    if [[ "${risk_acceptance_active}" == "true" ]]; then
                      echo "ACCEPTED TEMPORARILY: ${severity} ${cve} (${uri})"
                      accepted_findings=$((accepted_findings + 1))
                    else
                      echo "BLOCKING: the risk acceptance for ${cve} expired on ${RISK_ACCEPTANCE_EXPIRES_ON}."
                      blocking_findings=$((blocking_findings + 1))
                    fi
                    ;;
                  *)
                    echo "BLOCKING: ${severity} ${cve} (${uri})"
                    blocking_findings=$((blocking_findings + 1))
                    ;;
                esac
              done < <(printf '%s\n' "${findings}")
            fi

            expected_findings=$((critical + high))
            processed_findings=$((accepted_findings + blocking_findings))

            if (( processed_findings != expected_findings )); then
              echo "ECR finding count mismatch: expected=${expected_findings}, processed=${processed_findings}."
              echo "The deployment is blocked because the scan result could not be evaluated completely."
              exit 1
            fi

            echo "ECR decision: HIGH=${high}, CRITICAL=${critical}, accepted=${accepted_findings}, blocking=${blocking_findings}"

            if (( blocking_findings > 0 )); then
              echo "The image contains HIGH or CRITICAL vulnerabilities without an approved exception."
              exit 1
            fi

            if (( accepted_findings > 0 )); then
              echo "Deployment is allowed by a temporary, documented risk acceptance."
              echo "Risk acceptance valid through ${RISK_ACCEPTANCE_EXPIRES_ON}."
            else
              echo "No HIGH or CRITICAL vulnerabilities were found."
            fi
      - run:
          name: Persist deployed image reference
          command: |
            set -euo pipefail

            {
              echo "export IMAGE_URI=${IMAGE_URI}"
              echo "export ECR_REGISTRY=${ECR_REGISTRY}"
            } > /tmp/deploy-image.env
      - persist_to_workspace:
          root: /tmp
          paths:
            - deploy-image.env

  # CD: aprovisiona la infraestructura en AWS con Terraform (VPC, SG, EC2).
  tf-provision:
    executor: node/default
    environment:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Install Terraform CLI
          command: |
            set -euo pipefail
            TF_VERSION="1.10.5"
            curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
            sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
            rm /tmp/terraform.zip
            terraform --version
      - run:
          name: Terraform Init
          command: |
            cd terraform
            terraform init
      - run:
          name: Terraform Plan
          command: |
            cd terraform
            terraform plan -out=tfplan
      - run:
          name: Terraform Apply
          command: |
            cd terraform
            terraform apply -auto-approve tfplan
      - run:
          name: Export Terraform outputs
          command: |
            set -euo pipefail
            cd terraform

            CLUSTER_NAME="$(terraform output -raw cluster_name)"
            CLUSTER_ENDPOINT="$(terraform output -raw cluster_endpoint)"
            ECR_REGISTRY="$(terraform output -raw ecr_registry)"

            {
              echo "export CLUSTER_NAME=${CLUSTER_NAME}"
              echo "export CLUSTER_ENDPOINT=${CLUSTER_ENDPOINT}"
              echo "export ECR_REGISTRY=${ECR_REGISTRY}"
            } > /tmp/tf-outputs.env
      - persist_to_workspace:
          root: /tmp
          paths:
            - tf-outputs.env

  # CD: despliega el contenedor Docker en EKS usando kubectl.
  deploy-eks:
    executor: node/default
    environment:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - aws-cli/setup
      - run:
          name: Load deployment references
          command: |
            set -euo pipefail

            test -s /tmp/deploy-image.env
            source /tmp/deploy-image.env
            echo "export IMAGE_URI=${IMAGE_URI}" >> "${BASH_ENV}"
            echo "export ECR_REGISTRY=${ECR_REGISTRY}" >> "${BASH_ENV}"

            test -s /tmp/tf-outputs.env
            source /tmp/tf-outputs.env
            echo "export CLUSTER_NAME=${CLUSTER_NAME}" >> "${BASH_ENV}"
            echo "export CLUSTER_ENDPOINT=${CLUSTER_ENDPOINT}" >> "${BASH_ENV}"
      - run:
          name: Install kubectl
          command: |
            curl -O https://s3.us-west-2.amazonaws.com/amazon-eks/1.30.0/2024-05-12/bin/linux/amd64/kubectl
            chmod +x ./kubectl
            sudo mv ./kubectl /usr/local/bin/kubectl
      - run:
          name: Configure kubectl for EKS
          command: |
            aws eks update-kubeconfig --region "${AWS_DEFAULT_REGION}" --name "${CLUSTER_NAME}"
      - run:
          name: Deploy to Kubernetes
          command: |
            set -euo pipefail
            
            # Reemplazar la imagen en el archivo backend-deployment.yaml con el IMAGE_URI generado en CI
            # Inyectar variables de la base de datos al clúster como un Secreto
            kubectl create secret generic backend-db-secret \
              --from-literal=DB_HOST="${DB_HOST}" \
              --from-literal=DB_PORT="${DB_PORT}" \
              --from-literal=DB_NAME="${DB_NAME}" \
              --from-literal=DB_USER="${DB_USER}" \
              --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
              --from-literal=DB_SSL="${DB_SSL}" \
              --dry-run=client -o yaml | kubectl apply -f -
            
            # Reemplazar la imagen en el archivo backend-deployment.yaml con el IMAGE_URI generado en CI
            sed -i "s|image: monos-phoenix-back:latest|image: ${IMAGE_URI}|g" k8s/backend-deployment.yaml
            
            # Aplicar manifiestos
            kubectl apply -f k8s/
            
            echo "Verificando el estado del despliegue..."
            kubectl rollout status deployment/backend-deployment
            
            echo "==================================="
            echo "URL pública de tu Backend (API):"
            kubectl get svc backend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
            echo ""
            echo "==================================="

workflows:
  ci-cd-container:
    jobs:
      # CI runs on every branch and does not require AWS credentials.
      - validate
      - build-image:
          requires:
            - validate

      # CD is restricted to the trusted develop branch.
      - publish-image:
          # The context must contain protected, least-privilege AWS credentials.
          context: aws-deploy
          requires:
            - build-image
          filters:
            branches:
              only:
                - develop
      - tf-provision:
          context: aws-deploy
          requires:
            - publish-image
          filters:
            branches:
              only:
                - develop
      - deploy-eks:
          context: aws-deploy
          requires:
            - publish-image
            - tf-provision
          filters:
            branches:
              only:
                - develop
