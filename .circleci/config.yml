version: 2.1

orbs:
  node: circleci/node@5
  aws-cli: circleci/aws-cli@5.1.2

jobs:
  # CI: calidad, pruebas, auditoría de dependencias y compilación.
  validate:
    executor: node/default
    environment:
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Check code quality
          command: pnpm lint
      - run:
          name: Run unit tests
          command: pnpm exec jest --ci --runInBand --reporters=default --reporters=jest-junit
      - run:
          name: Audit production dependencies
          command: pnpm audit --prod --audit-level high || true
      - run:
          name: Build HTTP application
          command: pnpm run build:http
      - store_test_results:
          path: ./test-results/

  # CI: construye la imagen Docker HTTP una sola vez para que CD no compile
  # un artefacto diferente al que fue validado.
  build-image:
    executor: node/default
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build production HTTP image
          command: |
            set -euo pipefail

            IMAGE_NAME="monos-phoenix-back"
            IMAGE_TAG="${CIRCLE_SHA1}"
            LOCAL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

            docker build \
              --pull \
              --platform linux/amd64 \
              --provenance=false \
              --tag "${LOCAL_IMAGE}" \
              .

            docker save "${LOCAL_IMAGE}" |
              gzip > /tmp/monos-phoenix-back-image.tar.gz
      - persist_to_workspace:
          root: /tmp
          paths:
            - monos-phoenix-back-image.tar.gz

  # CD: publica en ECR solamente desde develop y espera el escaneo de la
  # imagen antes de permitir el despliegue.
  publish-image:
    executor: node/default
    environment:
      AWS_DEFAULT_REGION: us-east-1
      ECR_REPOSITORY: monos-phoenix-back
    steps:
      - attach_workspace:
          at: /tmp
      - setup_remote_docker
      - aws-cli/setup
      - run:
          name: Load image built by CI
          command: |
            set -euo pipefail

            test -s /tmp/monos-phoenix-back-image.tar.gz
            docker load --input /tmp/monos-phoenix-back-image.tar.gz
      - run:
          name: Resolve immutable image reference
          command: |
            set -euo pipefail

            AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            IMAGE_TAG="${CIRCLE_SHA1}"
            LOCAL_IMAGE="monos-phoenix-back:${IMAGE_TAG}"
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            {
              echo "export ECR_REGISTRY=${ECR_REGISTRY}"
              echo "export IMAGE_TAG=${IMAGE_TAG}"
              echo "export LOCAL_IMAGE=${LOCAL_IMAGE}"
              echo "export IMAGE_URI=${IMAGE_URI}"
            } >> "${BASH_ENV}"
      - run:
          name: Authenticate Docker to Amazon ECR
          command: |
            set -euo pipefail

            aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" |
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"
      - run:
          name: Push immutable image
          command: |
            set -euo pipefail

            if ECR_IMAGE_RESULT="$(aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1)"; then
              echo "Image ${IMAGE_URI} already exists; reusing the immutable artifact."
            elif [[ "${ECR_IMAGE_RESULT}" == *"ImageNotFoundException"* ]]; then
              docker tag "${LOCAL_IMAGE}" "${IMAGE_URI}"
              docker push "${IMAGE_URI}"
            else
              echo "${ECR_IMAGE_RESULT}"
              exit 1
            fi
      - run:
          name: Wait for ECR vulnerability scan
          command: |
            set -euo pipefail

            scan_status=""
            for attempt in $(seq 1 30); do
              scan_status="$(aws ecr describe-image-scan-findings \
                --repository-name "${ECR_REPOSITORY}" \
                --image-id "imageTag=${IMAGE_TAG}" \
                --query 'imageScanStatus.status' \
                --output text 2>/dev/null || true)"

              case "${scan_status}" in
                COMPLETE)
                  break
                  ;;
                FAILED|UNSUPPORTED_IMAGE)
                  echo "ECR image scan finished with status: ${scan_status}"
                  exit 1
                  ;;
                *)
                  echo "ECR image scan status: ${scan_status:-UNKNOWN}; waiting..."
                  sleep 10
                  ;;
              esac
            done

            if [[ "${scan_status}" != "COMPLETE" ]]; then
              echo "ECR image scan did not complete within the expected time."
              echo "Enable scan-on-push for the ECR repository."
              exit 1
            fi

            echo "ECR HIGH/CRITICAL finding details:"
            aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findings[?severity==`HIGH` || severity==`CRITICAL`].{severity:severity,cve:name,attributes:attributes,uri:uri}' \
              --output json

            findings="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findings[?severity==`HIGH` || severity==`CRITICAL`].[severity,name,uri]' \
              --output text)"

            # Temporary, explicit risk acceptance for vulnerabilities inherited
            # from the Node.js 24 base image.
            RISK_ACCEPTANCE_EXPIRES_ON="2026-08-31"
            risk_acceptance_active=true

            if [[ "$(date -u +%Y-%m-%d)" > "${RISK_ACCEPTANCE_EXPIRES_ON}" ]]; then
              risk_acceptance_active=false
            fi

            critical="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
              --output text)"
            high="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanFindings.findingSeverityCounts.HIGH' \
              --output text)"

            [[ -z "${critical}" || "${critical}" == "None" ]] && critical=0
            [[ -z "${high}" || "${high}" == "None" ]] && high=0

            accepted_findings=0
            blocking_findings=0

            if [[ -n "${findings}" && "${findings}" != "None" ]]; then
              while IFS=$'\t' read -r severity cve uri; do
                if [[ -z "${cve}" || "${cve}" == "None" ]]; then
                  echo "BLOCKING: ECR returned a HIGH/CRITICAL finding without a CVE identifier."
                  blocking_findings=$((blocking_findings + 1))
                  continue
                fi

                case "${cve}" in
                  CVE-2026-58016|CVE-2026-54369)
                    if [[ "${risk_acceptance_active}" == "true" ]]; then
                      echo "ACCEPTED TEMPORARILY: ${severity} ${cve} (${uri})"
                      accepted_findings=$((accepted_findings + 1))
                    else
                      echo "BLOCKING: the risk acceptance for ${cve} expired on ${RISK_ACCEPTANCE_EXPIRES_ON}."
                      blocking_findings=$((blocking_findings + 1))
                    fi
                    ;;
                  *)
                    echo "BLOCKING: ${severity} ${cve} (${uri})"
                    blocking_findings=$((blocking_findings + 1))
                    ;;
                esac
              done < <(printf '%s\n' "${findings}")
            fi

            expected_findings=$((critical + high))
            processed_findings=$((accepted_findings + blocking_findings))

            if (( processed_findings != expected_findings )); then
              echo "ECR finding count mismatch: expected=${expected_findings}, processed=${processed_findings}."
              echo "The deployment is blocked because the scan result could not be evaluated completely."
              exit 1
            fi

            echo "ECR decision: HIGH=${high}, CRITICAL=${critical}, accepted=${accepted_findings}, blocking=${blocking_findings}"

            if (( blocking_findings > 0 )); then
              echo "The image contains HIGH or CRITICAL vulnerabilities without an approved exception."
              exit 1
            fi

            if (( accepted_findings > 0 )); then
              echo "Deployment is allowed by a temporary, documented risk acceptance."
              echo "Risk acceptance valid through ${RISK_ACCEPTANCE_EXPIRES_ON}."
            else
              echo "No HIGH or CRITICAL vulnerabilities were found."
            fi
      - run:
          name: Persist deployed image reference
          command: |
            set -euo pipefail

            {
              echo "export IMAGE_URI=${IMAGE_URI}"
              echo "export ECR_REGISTRY=${ECR_REGISTRY}"
            } > /tmp/deploy-image.env
      - persist_to_workspace:
          root: /tmp
          paths:
            - deploy-image.env

  # CD: aprovisiona la infraestructura en AWS con Terraform (VPC, SG, EC2).
  tf-provision:
    executor: node/default
    environment:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Install Terraform CLI
          command: |
            set -euo pipefail
            TF_VERSION="1.10.5"
            curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
            sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
            rm /tmp/terraform.zip
            terraform --version
      - run:
          name: Terraform Init
          command: |
            cd terraform
            terraform init
      - run:
          name: Terraform Plan
          command: |
            cd terraform
            terraform plan -out=tfplan
      - run:
          name: Terraform Apply
          command: |
            cd terraform
            terraform apply -auto-approve tfplan
      - run:
          name: Export Terraform outputs
          command: |
            set -euo pipefail
            cd terraform

            INSTANCE_ID="$(terraform output -raw ec2_instance_id)"
            EC2_PUBLIC_IP="$(terraform output -raw ec2_public_ip)"
            ECR_REGISTRY="$(terraform output -raw ecr_registry)"

            {
              echo "export INSTANCE_ID=${INSTANCE_ID}"
              echo "export EC2_PUBLIC_IP=${EC2_PUBLIC_IP}"
              echo "export ECR_REGISTRY=${ECR_REGISTRY}"
            } > /tmp/tf-outputs.env
      - persist_to_workspace:
          root: /tmp
          paths:
            - tf-outputs.env

  # CD: despliega el contenedor Docker en la VM via AWS SSM (sin SSH).
  deploy-vm:
    executor: node/default
    environment:
      AWS_DEFAULT_REGION: us-east-1
      ECR_REPOSITORY: monos-phoenix-back
    steps:
      - attach_workspace:
          at: /tmp
      - aws-cli/setup
      - run:
          name: Load deployment references
          command: |
            set -euo pipefail

            test -s /tmp/deploy-image.env
            source /tmp/deploy-image.env
            echo "export IMAGE_URI=${IMAGE_URI}" >> "${BASH_ENV}"
            echo "export ECR_REGISTRY=${ECR_REGISTRY}" >> "${BASH_ENV}"

            test -s /tmp/tf-outputs.env
            source /tmp/tf-outputs.env
            echo "export INSTANCE_ID=${INSTANCE_ID}" >> "${BASH_ENV}"
            echo "export EC2_PUBLIC_IP=${EC2_PUBLIC_IP}" >> "${BASH_ENV}"
      - run:
          name: Wait for EC2 instance to be ready
          command: |
            set -euo pipefail

            echo "Waiting for SSM agent on instance ${INSTANCE_ID}..."
            for attempt in $(seq 1 30); do
              status="$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || echo "NotFound")"

              if [[ "${status}" == "Online" ]]; then
                echo "SSM Agent is online on ${INSTANCE_ID}."
                break
              fi
              echo "SSM status: ${status}; waiting... (attempt ${attempt}/30)"
              sleep 10
            done

            if [[ "${status}" != "Online" ]]; then
              echo "SSM Agent did not come online within the expected time."
              exit 1
            fi
      - run:
          name: Deploy container via SSM
          command: |
            set -euo pipefail

            COMMAND_ID="$(aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy monos-phoenix-back ${CIRCLE_SHA1}" \
              --parameters "commands=[
                \"export PATH=\$PATH:/usr/local/bin:/usr/bin\",
                \"cloud-init status --wait || true\",
                \"aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
                \"docker pull ${IMAGE_URI}\",
                \"docker stop monos-phoenix-back || true\",
                \"docker rm monos-phoenix-back || true\",
                \"docker run -d --name monos-phoenix-back --restart unless-stopped -p 80:3000 -e DB_HOST=${DB_HOST} -e DB_PORT=${DB_PORT} -e DB_NAME=${DB_NAME} -e DB_USER=${DB_USER} -e DB_PASSWORD=${DB_PASSWORD} -e DB_SSL=${DB_SSL} -e NODE_ENV=production ${IMAGE_URI}\",
                \"docker stop cloudflared || true\",
                \"docker rm cloudflared || true\",
                \"docker run -d --name cloudflared --network host --restart unless-stopped cloudflare/cloudflared:latest tunnel --url http://localhost:80\"
              ]" \
              --query 'Command.CommandId' \
              --output text)"

            echo "SSM Command sent: ${COMMAND_ID}"
            echo "Waiting for command to complete..."

            aws ssm wait command-executed \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" || true

            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text)"

            echo "Command status: ${STATUS}"

            if [[ "${STATUS}" != "Success" ]]; then
              echo "SSM command output:"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query '[StandardOutputContent, StandardErrorContent]' \
                --output text
              exit 1
            fi
      - run:
          name: Verify deployment
          command: |
            set -euo pipefail

            echo "Waiting for application to start on ${EC2_PUBLIC_IP}..."
            sleep 15

            HTTP_STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 10 \
              "http://${EC2_PUBLIC_IP}/" || echo "000")"

            if [[ "${HTTP_STATUS}" =~ ^(200|301|302)$ ]]; then
              echo "Application is running at http://${EC2_PUBLIC_IP}/ (HTTP ${HTTP_STATUS})"
            else
              echo " Application returned HTTP ${HTTP_STATUS}. Check container logs on the VM."
              echo "The container may still be starting up."
            fi

            echo "--------------------------------------------------------"
            echo "Fetching Cloudflare HTTPS Tunnel URL..."
            sleep 5
            aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["docker logs cloudflared 2>&1 | grep -o '\''https://.*trycloudflare.com'\'' | head -n 1"]' \
              --query 'Command.CommandId' \
              --output text > /tmp/cmd_id.txt

            sleep 5
            CMD_ID="$(cat /tmp/cmd_id.txt)"
            CF_URL="$(aws ssm get-command-invocation --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" --query 'StandardOutputContent' --output text || echo "")"
            echo "HTTPS URL (Cloudflare Tunnel): ${CF_URL}"
            echo "--------------------------------------------------------"

workflows:
  ci-cd-container:
    jobs:
      # CI runs on every branch and does not require AWS credentials.
      - validate
      - build-image:
          requires:
            - validate

      # CD is restricted to the trusted develop branch.
      - publish-image:
          # The context must contain protected, least-privilege AWS credentials.
          context: aws-deploy
          requires:
            - build-image
          filters:
            branches:
              only:
                - develop
      - tf-provision:
          context: aws-deploy
          requires:
            - publish-image
          filters:
            branches:
              only:
                - develop
      - deploy-vm:
          context: aws-deploy
          requires:
            - publish-image
            - tf-provision
          filters:
            branches:
              only:
                - develop
