name: monos-phoenix-local

services:
  # ---------------------------------------------------------------------------
  # App Services
  # ---------------------------------------------------------------------------
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monos_phoenix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monos_phoenix"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: monos_phoenix
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    init: true

  # ---------------------------------------------------------------------------
  # Security Monitoring Stack (Falco → Falcosidekick → Loki → Grafana)
  # ---------------------------------------------------------------------------

  # Falco: Runtime security engine - monitors all containers via syscalls
  # Engine: modern_ebpf (configured in falco/falco.yaml)
  # Output goes ONLY to falcosidekick (no console output)
  falco:
    image: falcosecurity/falco:latest
    privileged: true
    # Config file sets: engine=modern_ebpf, http_output→falcosidekick, no stdout
    command: ["/usr/bin/falco", "-c", "/etc/falco/falco.yaml"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - ./falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./falco/rules:/etc/falco/rules.d:ro
    environment:
      - HOST_ROOT=/host
      - SKIP_DRIVER_LOADER=1
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
      - BPF
    restart: unless-stopped
    depends_on:
      - falcosidekick
    networks:
      - monitoring

  # Falcosidekick: Receives Falco events and forwards to Loki
  # No stdout, all events go to Loki for Grafana visualization
  falcosidekick:
    image: falcosecurity/falcosidekick:latest
    environment:
      # Loki output
      - LOKI_HOSTPORT=http://loki:3100
      - LOKI_MINIMUMPRIORITY=notice
      - LOKI_CUSTOMLABELS=app:falco,env:local,project:monos-phoenix
      - LOKI_TENANT=""
      # Disable all other outputs
      - DEBUG=false
      - SLACK_WEBHOOKURL=""
      - TEAMS_WEBHOOKURL=""
      
      # Discord Notifications
      - DISCORD_WEBHOOKURL=https://discord.com/api/webhooks/1532101213846372432/Grh1aYkuWZfYFNxQXZwRbQ98_VjuPhG_pZc6LoOaFjfwO4iyJP44uI5fYP9ChDEIerd4
      - DISCORD_MINIMUMPRIORITY=warning
    ports:
      - "2801:2801"
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring

  # Loki: Log aggregation - stores Falco security events
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - monitoring

  # Promtail: Recolecta logs de los contenedores (console.log) y los envía a Loki
  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana: Real-time security dashboard
  # Access at: http://localhost:3001 (admin / admin)
  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      # Dark theme by default
      - GF_USERS_DEFAULT_THEME=dark
      # Auto-login for demo
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  postgres_data:
  loki_data:
  grafana_data:

